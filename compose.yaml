services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: translator-lab-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-translator_lab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - translator_lab_postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: translator-lab-backend:${TRANSLATOR_LAB_VERSION:-1.0.0-rc.1}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: translator-lab-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-translator_lab}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      DATABASE_TABLE: ${DATABASE_TABLE:-geoms}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_CONNECTION_CONFIG_PATH: /app/config/database-connection.json
      FEATURE_API_HOST: 0.0.0.0
      FEATURE_API_PORT: 3006
      FEATURE_API_ALLOWED_ORIGINS: ${FEATURE_API_ALLOWED_ORIGINS:-http://127.0.0.1:3005,http://localhost:3005}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-local}
      TRANSLATION_WORKER_ENABLED: ${TRANSLATION_WORKER_ENABLED:-true}
      TRANSLATION_AUTO_APPLY: ${TRANSLATION_AUTO_APPLY:-false}
      TRANSLATION_ALLOW_API_APPLY: ${TRANSLATION_ALLOW_API_APPLY:-false}
      ONLINE_PROVIDER_COMPARISON_ENABLED: ${ONLINE_PROVIDER_COMPARISON_ENABLED:-false}
      TRANSLATION_WORKER_BATCH_SIZE: ${TRANSLATION_WORKER_BATCH_SIZE:-20}
      TRANSLATION_WORKER_INTERVAL_MS: ${TRANSLATION_WORKER_INTERVAL_MS:-300000}
      LOCAL_TRANSLATION_BASE_URL: ${LOCAL_TRANSLATION_BASE_URL_DOCKER:-http://host.docker.internal:1234/api/v1}
      LOCAL_TRANSLATION_MODEL: ${LOCAL_TRANSLATION_MODEL:-qwen/qwen3.5-9b}
      LOCAL_TRANSLATION_API_KEY: ${LOCAL_TRANSLATION_API_KEY:-lm-studio}
      LOCAL_TRANSLATION_BATCH_SIZE: ${LOCAL_TRANSLATION_BATCH_SIZE:-1}
      MADLAD_TRANSLATION_BASE_URL: ${MADLAD_TRANSLATION_BASE_URL_DOCKER:-http://host.docker.internal:3007}
      MADLAD_TRANSLATION_MODEL: ${MADLAD_TRANSLATION_MODEL:-google/madlad400-3b-mt}
      MADLAD_TRANSLATION_BATCH_SIZE: ${MADLAD_TRANSLATION_BATCH_SIZE:-20}
      MADLAD_TRANSLATION_TIMEOUT_MS: ${MADLAD_TRANSLATION_TIMEOUT_MS:-180000}
      PROPER_NAME_JUDGE_ENABLED: ${PROPER_NAME_JUDGE_ENABLED:-true}
      PROPER_NAME_JUDGE_BASE_URL: ${PROPER_NAME_JUDGE_BASE_URL_DOCKER:-http://host.docker.internal:1234/api/v1}
      PROPER_NAME_JUDGE_MODEL: ${PROPER_NAME_JUDGE_MODEL:-qwen3.5-4b}
      PROPER_NAME_JUDGE_SECONDARY_MODEL: ${PROPER_NAME_JUDGE_SECONDARY_MODEL:-qwen/qwen3.5-9b}
      PROPER_NAME_JUDGE_TIMEOUT_MS: ${PROPER_NAME_JUDGE_TIMEOUT_MS:-120000}
      PROPER_NAME_JUDGE_BATCH_SIZE: ${PROPER_NAME_JUDGE_BATCH_SIZE:-1}
      APPROVED_TRANSLATION_MEMORY_PATH: /app/approved-translations/translation-memory.json
      OSM_IDENTITY_SNAPSHOT_PATH: /app/identity/osm-identity-snapshot.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - translator_lab_config:/app/config
      - ./work/approved-translations:/app/approved-translations:ro
      - ./work/identity:/app/identity:ro
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    image: translator-lab-frontend:${TRANSLATOR_LAB_VERSION:-1.0.0-rc.1}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_FEATURES_API_URL: ${VITE_FEATURES_API_URL:-http://127.0.0.1:3006/api/v1/features}
    container_name: translator-lab-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-local}
      LOCAL_TRANSLATION_BASE_URL: ${LOCAL_TRANSLATION_BASE_URL_DOCKER:-http://host.docker.internal:1234/api/v1}
      LOCAL_TRANSLATION_MODEL: ${LOCAL_TRANSLATION_MODEL:-qwen/qwen3.5-9b}
      LOCAL_TRANSLATION_API_KEY: ${LOCAL_TRANSLATION_API_KEY:-lm-studio}
      LOCAL_TRANSLATION_BATCH_SIZE: ${LOCAL_TRANSLATION_BATCH_SIZE:-1}
      MADLAD_TRANSLATION_BASE_URL: ${MADLAD_TRANSLATION_BASE_URL_DOCKER:-http://host.docker.internal:3007}
      MADLAD_TRANSLATION_MODEL: ${MADLAD_TRANSLATION_MODEL:-google/madlad400-3b-mt}
      MADLAD_TRANSLATION_BATCH_SIZE: ${MADLAD_TRANSLATION_BATCH_SIZE:-20}
      MADLAD_TRANSLATION_TIMEOUT_MS: ${MADLAD_TRANSLATION_TIMEOUT_MS:-180000}
      PROPER_NAME_JUDGE_ENABLED: ${PROPER_NAME_JUDGE_ENABLED:-true}
      PROPER_NAME_JUDGE_BASE_URL: ${PROPER_NAME_JUDGE_BASE_URL_DOCKER:-http://host.docker.internal:1234/api/v1}
      PROPER_NAME_JUDGE_MODEL: ${PROPER_NAME_JUDGE_MODEL:-qwen3.5-4b}
      PROPER_NAME_JUDGE_SECONDARY_MODEL: ${PROPER_NAME_JUDGE_SECONDARY_MODEL:-qwen/qwen3.5-9b}
      PROPER_NAME_JUDGE_TIMEOUT_MS: ${PROPER_NAME_JUDGE_TIMEOUT_MS:-120000}
      PROPER_NAME_JUDGE_BATCH_SIZE: ${PROPER_NAME_JUDGE_BATCH_SIZE:-1}
      APPROVED_TRANSLATION_MEMORY_PATH: /app/approved-translations/translation-memory.json
      OSM_IDENTITY_SNAPSHOT_PATH: /app/identity/osm-identity-snapshot.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./work/approved-translations:/app/approved-translations:ro
      - ./work/identity:/app/identity:ro
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:3005:3005"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  translator_lab_postgres:
  translator_lab_config:
